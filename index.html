<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>BrainDrop — Кейсы и Апгрейдер</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #070d19;
            --card: #0e182c;
            --card-light: #172744;
            --border-subtle: #1f3358;
            
            --blue-accent: #2589f5;
            --blue-glow: rgba(37, 137, 245, 0.25);
            --cyan-soft: #60b5ff;
            
            --orange-accent: #f97316;
            --orange-hover: #ea580c;
            --orange-soft: #fb923c;
            --orange-bg: rgba(249, 115, 22, 0.15);
            
            --danger: #e11d48;
            --text: #e2e8f0;
            --muted: #7f94b5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            background-color: var(--bg);
            color: var(--text);
        }

        body {
            background-image: radial-gradient(circle at 50% 0%, rgba(37, 137, 245, 0.12) 0%, transparent 60%);
            padding: 10px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 40px;
        }

        /* Закрепленная компактная шапка: аватарка + ник слева, баланс справа */
        .header {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            background: rgba(14, 24, 44, 0.94);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-subtle);
            padding: 8px 12px;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
        }

        .profile-block {
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 0;
            flex: 1;
        }

        .avatar-wrap {
            width: 36px;
            height: 36px;
            min-width: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--blue-accent), var(--orange-accent));
            padding: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--card);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 14px;
            color: var(--cyan-soft);
            overflow: hidden;
        }

        .avatar-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .user-meta {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .brand-tag {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--cyan-soft);
        }

        .user-name {
            font-weight: 700;
            font-size: 13px;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .balance-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            background: var(--orange-bg);
            border: 1px solid rgba(249, 115, 22, 0.4);
            padding: 5px 8px 5px 10px;
            border-radius: 10px;
            color: var(--orange-soft);
            font-weight: 800;
            font-size: 13px;
            white-space: nowrap;
        }

        .btn-plus {
            background: var(--orange-accent);
            color: #fff;
            border: none;
            width: 24px;
            height: 24px;
            min-width: 24px;
            border-radius: 7px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.15s;
        }

        .btn-plus:active {
            transform: scale(0.92);
        }

        .toast {
            background: var(--card-light);
            color: var(--text);
            padding: 9px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            display: none;
        }

        .toast.show { display: block; }
        .toast.error { background: rgba(225, 29, 72, 0.18); border: 1px solid var(--danger); color: #fda4af; }
        .toast.success { background: rgba(37, 137, 245, 0.18); border: 1px solid var(--blue-accent); color: #93c5fd; }

        /* Вкладки (без эмодзи) */
        .tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            background: var(--card);
            border: 1px solid var(--border-subtle);
            padding: 4px;
            border-radius: 12px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--muted);
            padding: 9px 4px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--blue-accent);
            color: #ffffff;
            box-shadow: 0 2px 10px var(--blue-glow);
        }

        .section {
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        .section.active {
            display: flex;
        }

        /* Картинки */
        .media-box {
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .media-big { width: 76px; height: 76px; font-size: 38px; }
        .media-med { width: 58px; height: 58px; font-size: 28px; }
        .media-small { width: 42px; height: 42px; font-size: 20px; }

        .media-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        /* Сетки и карточки */
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }

        .card {
            background: var(--card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-align: center;
            gap: 6px;
            min-width: 0;
            transition: 0.15s;
        }

        .card.clickable { cursor: pointer; }
        .card.selected {
            border-color: var(--orange-accent);
            background: rgba(249, 115, 22, 0.1);
            box-shadow: 0 0 12px rgba(249, 115, 22, 0.18);
        }

        .price-tag {
            background: var(--bg);
            border: 1px solid var(--border-subtle);
            padding: 3px 8px;
            border-radius: 7px;
            font-size: 11px;
            font-weight: 700;
            color: var(--orange-soft);
        }

        .btn {
            background: linear-gradient(135deg, var(--blue-accent), #1d6fd1);
            color: #fff;
            border: none;
            padding: 9px 10px;
            border-radius: 9px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            width: 100%;
            transition: 0.15s;
        }

        .btn:active { transform: scale(0.97); }
        .btn:disabled { background: var(--card-light); color: var(--muted); opacity: 0.65; cursor: not-allowed; transform: none; }
        
        .btn-orange {
            background: linear-gradient(135deg, var(--orange-accent), var(--orange-hover));
        }

        .btn-sell {
            background: var(--card-light);
            border: 1px solid var(--border-subtle);
            color: var(--text);
            font-size: 11px;
            padding: 6px;
        }

        /* Редкость */
        .r-common { border-bottom: 3px solid #64748b; }
        .r-rare { border-bottom: 3px solid #2589f5; }
        .r-epic { border-bottom: 3px solid #8b5cf6; }
        .r-legendary { border-bottom: 3px solid #f97316; }
        .r-mythic { border-bottom: 3px solid #eab308; }

        /* РУЛЕТКА ОТКРЫТИЯ КЕЙСА */
        .roulette-modal {
            background: var(--card);
            border-radius: 14px;
            padding: 14px 10px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
        }

        .roulette-modal.active { display: flex; }

        .roulette-viewport {
            position: relative;
            width: 100%;
            height: 116px;
            background: var(--bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-subtle);
        }

        .roulette-marker {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            background: var(--orange-accent);
            transform: translateX(-50%);
            z-index: 10;
            box-shadow: 0 0 8px var(--orange-accent);
        }

        .roulette-marker::before {
            content: "";
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 8px solid var(--orange-accent);
        }

        .roulette-marker::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 8px solid var(--orange-accent);
        }

        .roulette-track {
            display: flex;
            align-items: center;
            height: 100%;
            gap: 8px;
            padding-left: 8px;
            will-change: transform;
        }

        .roulette-slot {
            flex: 0 0 96px;
            width: 96px;
            height: 100px;
            background: var(--card);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5px;
            gap: 4px;
            text-align: center;
        }

        .roulette-slot-name {
            font-size: 10px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        /* Апгрейдер */
        .wheel-box {
            background: var(--card);
            border: 1px solid var(--border-subtle);
            padding: 16px 12px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .wheel-wrap {
            position: relative;
            width: 176px;
            height: 176px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pointer {
            position: absolute;
            top: -8px;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 18px solid var(--orange-accent);
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 3.2s cubic-bezier(0.15, 0.85, 0.25, 1);
            background: var(--card-light);
            box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.65);
        }

        .wheel-inner {
            position: absolute;
            width: 124px;
            height: 124px;
            background: var(--bg);
            border: 1px solid var(--border-subtle);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }

        .panel {
            background: var(--card);
            border: 1px solid var(--border-subtle);
            padding: 12px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        input[type="number"] {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border-subtle);
            color: var(--text);
            padding: 10px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 700;
            outline: none;
        }

        input[type="number"]:focus { border-color: var(--blue-accent); }

        .mode-switch {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .mode-btn {
            padding: 8px;
            background: var(--bg);
            border: 1px solid var(--border-subtle);
            color: var(--muted);
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: 0.15s;
        }

        .mode-btn.active {
            border-color: var(--blue-accent);
            color: var(--cyan-soft);
            background: rgba(37, 137, 245, 0.14);
        }
    </style>
</head>
<body>

<div class="app">
    <!-- Закрепленная шапка с аватаркой Telegram и балансом без горизонтальной прокрутки -->
    <div class="header">
        <div class="profile-block">
            <div class="avatar-wrap">
                <div class="avatar-inner" id="avatarBox">BD</div>
            </div>
            <div class="user-meta">
                <div class="brand-tag">BrainDrop</div>
                <div class="user-name" id="userLabel">Игрок</div>
            </div>
        </div>
        <div class="balance-pill">
            <span><span id="balanceVal">...</span> монет</span>
            <button type="button" class="btn-plus" id="bonusBtn" title="Добавить +500 монет">+</button>
        </div>
    </div>

    <div class="toast" id="toastBox"></div>

    <!-- Вкладки без эмодзи -->
    <div class="tabs">
        <button type="button" class="tab-btn active" data-tab="cases">Кейсы</button>
        <button type="button" class="tab-btn" data-tab="upgrader">Апгрейдер</button>
        <button type="button" class="tab-btn" data-tab="inventory">Инвентарь (<span id="invCount">0</span>)</button>
    </div>

    <div id="tab-cases" class="section active">
        <div class="roulette-modal" id="rouletteBox">
            <div style="font-weight:700; font-size:13px;" id="rouletteTitle">Открываем кейс...</div>
            <div class="roulette-viewport" id="rouletteViewport">
                <div class="roulette-marker"></div>
                <div class="roulette-track" id="rouletteTrack"></div>
            </div>
            <div id="caseResult" style="text-align:center; font-weight:800; font-size:14px; color:var(--orange-soft); min-height:20px;"></div>
        </div>

        <div class="grid-2" id="casesGrid"></div>
    </div>

    <div id="tab-upgrader" class="section">
        <div class="wheel-box">
            <div class="wheel-wrap">
                <div class="pointer"></div>
                <div class="wheel" id="wheel"></div>
                <div class="wheel-inner">
                    <div id="chanceVal" style="font-size:22px; font-weight:800; color:var(--cyan-soft);">0%</div>
                    <div style="font-size:10px; color:var(--muted);">ШАНС</div>
                </div>
            </div>
            <div id="upgStatus" style="font-weight:700; font-size:13px; text-align:center; color:var(--muted);">Выберите ставку и цель</div>
        </div>

        <div class="panel">
            <div style="display:flex; justify-content:space-between; font-size:12px;">
                <span>1. Ваша ставка (вещи + монеты):</span>
                <strong style="color:var(--orange-soft);"><span id="totalBetVal">0</span> монет</strong>
            </div>
            <input type="number" id="upgCoinsInput" placeholder="Добавить монеты к ставке (0)" min="0">
            <div style="font-size:11px; color:var(--muted);">Нажмите на ваши предметы, чтобы добавить в ставку:</div>
            <div class="grid-3" id="upgMyItems" style="max-height: 160px; overflow-y: auto;"></div>
        </div>

        <div class="panel">
            <div style="font-size:12px;">2. Что хотите получить:</div>
            <div class="mode-switch">
                <button type="button" class="mode-btn active" id="modeItemBtn">Предмет</button>
                <button type="button" class="mode-btn" id="modeCoinsBtn">Монеты</button>
            </div>

            <div id="targetItemBox" class="grid-3" style="max-height: 170px; overflow-y: auto;"></div>

            <div id="targetCoinsBox" style="display:none;">
                <input type="number" id="targetCoinsInput" placeholder="Желаемая сумма выигрыша">
            </div>

            <button type="button" class="btn btn-orange" id="upgSpinBtn">Улучшить</button>
        </div>
    </div>

    <div id="tab-inventory" class="section">
        <div class="grid-3" id="invGrid"></div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
        try {
            tg.ready();
            tg.expand();
        } catch (e) {}
    }

    let userId = null;
    const avatarBox = document.getElementById("avatarBox");
    const userLabel = document.getElementById("userLabel");

    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
        const u = tg.initDataUnsafe.user;
        userId = String(u.id);
        const displayName = u.first_name || u.username || "Игрок";
        userLabel.innerText = displayName;

        // Подгружаем аватарку профиля из Telegram WebApp
        if (u.photo_url) {
            const img = document.createElement("img");
            img.src = u.photo_url;
            img.alt = displayName;
            img.onerror = () => {
                avatarBox.innerText = displayName.charAt(0).toUpperCase();
            };
            avatarBox.innerHTML = "";
            avatarBox.appendChild(img);
        } else {
            avatarBox.innerText = displayName.charAt(0).toUpperCase();
        }
    } else {
        userId = localStorage.getItem("bd_uid");
        if (!userId) {
            userId = "player_" + Math.floor(100000 + Math.random() * 900000);
            localStorage.setItem("bd_uid", userId);
        }
        avatarBox.innerText = "BD";
    }

    let state = { balance: 0, inventory: [], cases: [], all_items: [] };
    let selectedInvIds = new Set();
    let targetMode = "item";
    let selectedTargetItemId = null;
    let isSpinning = false;
    let rotation = 0;

    function renderMediaHTML(obj, sizeClass) {
        const fallback = obj.fallback || "";
        if (obj.image) {
            return `<div class="media-box ${sizeClass}"><img src="${obj.image}" alt="${obj.name}" onerror="this.parentElement.innerHTML='${fallback}'"></div>`;
        }
        return `<div class="media-box ${sizeClass}">${fallback}</div>`;
    }

    const toastBox = document.getElementById("toastBox");
    function showToast(msg, type = "") {
        toastBox.innerText = msg;
        toastBox.className = "toast show " + type;
        clearTimeout(toastBox._timer);
        toastBox._timer = setTimeout(() => {
            toastBox.className = "toast";
        }, 3500);
    }

    async function loadState() {
        try {
            const res = await fetch(`/api/state/${encodeURIComponent(userId)}`);
            if (!res.ok) {
                throw new Error(`Ошибка сервера (${res.status})`);
            }
            state = await res.json();
            document.getElementById("balanceVal").innerText = state.balance;
            document.getElementById("invCount").innerText = state.inventory.length;

            const existingIds = new Set(state.inventory.map(i => i.inv_id));
            selectedInvIds.forEach(id => {
                if (!existingIds.has(id)) selectedInvIds.delete(id);
            });

            renderCases();
            renderInventory();
            renderUpgraderLists();
            recalcUpgrade();
        } catch (err) {
            showToast(err.message || "Нет связи с сервером", "error");
        }
    }

    document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            if (isSpinning) return;
            const tabName = btn.getAttribute("data-tab");
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
            btn.classList.add("active");
            document.getElementById("tab-" + tabName).classList.add("active");
        });
    });

    document.getElementById("bonusBtn").addEventListener("click", async () => {
        if (isSpinning) return;
        try {
            const res = await fetch(`/api/bonus/${encodeURIComponent(userId)}`, { method: "POST" });
            if (!res.ok) throw new Error("Не удалось начислить бонус");
            showToast("+500 монет начислено", "success");
            await loadState();
        } catch (err) {
            showToast(err.message, "error");
        }
    });

    function renderCases() {
        const grid = document.getElementById("casesGrid");
        grid.innerHTML = "";
        state.cases.forEach(c => {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                ${renderMediaHTML(c, "media-big")}
                <div style="font-weight:700; font-size:13px;">${c.name}</div>
                <button type="button" class="btn" ${isSpinning ? "disabled" : ""}>Открыть за ${c.price}</button>
            `;
            card.querySelector("button").addEventListener("click", () => openCaseWithRoulette(c));
            grid.appendChild(card);
        });
    }

    async function openCaseWithRoulette(caseObj) {
        if (isSpinning) return;

        try {
            const res = await fetch("/api/open_case", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_id: userId, case_id: caseObj.id })
            });
            const data = await res.json();
            if (!res.ok) {
                showToast(data.detail || "Ошибка открытия кейса", "error");
                return;
            }

            isSpinning = true;
            document.getElementById("balanceVal").innerText = data.new_balance;
            renderCases();

            const rouletteBox = document.getElementById("rouletteBox");
            const track = document.getElementById("rouletteTrack");
            const viewport = document.getElementById("rouletteViewport");
            const resultEl = document.getElementById("caseResult");
            const titleEl = document.getElementById("rouletteTitle");

            rouletteBox.classList.add("active");
            rouletteBox.scrollIntoView({ behavior: "smooth", block: "nearest" });
            titleEl.innerText = `Открываем: ${caseObj.name}`;
            resultEl.innerText = "";

            const totalSlots = 45;
            const winIndex = 37;
            const pool = caseObj.possible_items && caseObj.possible_items.length > 0
                ? caseObj.possible_items
                : state.all_items;

            track.style.transition = "none";
            track.style.transform = "translateX(0px)";
            track.innerHTML = "";

            for (let i = 0; i < totalSlots; i++) {
                const item = (i === winIndex)
                    ? data.won_item
                    : pool[Math.floor(Math.random() * pool.length)];

                const slot = document.createElement("div");
                slot.className = `roulette-slot r-${item.rarity}`;
                slot.innerHTML = `
                    ${renderMediaHTML(item, "media-small")}
                    <div class="roulette-slot-name">${item.name}</div>
                    <div style="font-size:10px; color:var(--orange-soft); font-weight:700;">${item.price} монет</div>
                `;
                track.appendChild(slot);
            }

            void track.offsetWidth;

            const slotStep = 104;
            const viewportCenter = viewport.offsetWidth / 2;
            const winSlotCenter = 8 + (winIndex * slotStep) + 48;
            const randomJitter = Math.floor(Math.random() * 56) - 28;
            const targetOffset = winSlotCenter - viewportCenter + randomJitter;

            if (tg && tg.HapticFeedback) {
                try { tg.HapticFeedback.impactOccurred("medium"); } catch (e) {}
            }

            track.style.transition = "transform 4.2s cubic-bezier(0.12, 0.85, 0.22, 1)";
            track.style.transform = `translateX(-${targetOffset}px)`;

            setTimeout(async () => {
                isSpinning = false;
                titleEl.innerText = "Ваш выигрыш:";
                resultEl.innerText = `${data.won_item.name} (${data.won_item.price} монет)`;

                if (tg && tg.HapticFeedback) {
                    try { tg.HapticFeedback.notificationOccurred("success"); } catch (e) {}
                }

                await loadState();
            }, 4300);

        } catch (err) {
            isSpinning = false;
            renderCases();
            showToast("Ошибка соединения с сервером", "error");
        }
    }

    function renderInventory() {
        const grid = document.getElementById("invGrid");
        grid.innerHTML = "";
        if (state.inventory.length === 0) {
            grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:var(--muted); padding:24px; font-size:13px;">Инвентарь пуст. Откройте кейсы!</div>';
            return;
        }
        state.inventory.forEach(item => {
            const card = document.createElement("div");
            card.className = `card r-${item.rarity}`;
            card.innerHTML = `
                ${renderMediaHTML(item, "media-med")}
                <div style="font-size:11px; font-weight:600; width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.name}</div>
                <div class="price-tag">${item.price} монет</div>
                <button type="button" class="btn btn-sell">Продать</button>
            `;
            card.querySelector("button").addEventListener("click", () => sellItem(item.inv_id));
            grid.appendChild(card);
        });
    }

    async function sellItem(invId) {
        try {
            const res = await fetch("/api/sell_item", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_id: userId, inv_id: invId })
            });
            if (res.ok) {
                showToast("Предмет продан", "success");
                await loadState();
            }
        } catch (err) {
            showToast("Ошибка продажи", "error");
        }
    }

    document.getElementById("modeItemBtn").addEventListener("click", () => setTargetMode("item"));
    document.getElementById("modeCoinsBtn").addEventListener("click", () => setTargetMode("coins"));
    document.getElementById("upgCoinsInput").addEventListener("input", recalcUpgrade);
    document.getElementById("targetCoinsInput").addEventListener("input", recalcUpgrade);

    function setTargetMode(mode) {
        if (isSpinning) return;
        targetMode = mode;
        document.getElementById("modeItemBtn").classList.toggle("active", mode === "item");
        document.getElementById("modeCoinsBtn").classList.toggle("active", mode === "coins");
        document.getElementById("targetItemBox").style.display = mode === "item" ? "grid" : "none";
        document.getElementById("targetCoinsBox").style.display = mode === "coins" ? "block" : "none";
        recalcUpgrade();
    }

    function renderUpgraderLists() {
        const myBox = document.getElementById("upgMyItems");
        myBox.innerHTML = "";
        if (state.inventory.length === 0) {
            myBox.innerHTML = '<div style="grid-column:1/-1; font-size:11px; color:var(--muted);">Нет предметов в инвентаре</div>';
        } else {
            state.inventory.forEach(item => {
                const card = document.createElement("div");
                card.className = `card clickable r-${item.rarity} ${selectedInvIds.has(item.inv_id) ? "selected" : ""}`;
                card.style.padding = "7px 5px";
                card.innerHTML = `
                    ${renderMediaHTML(item, "media-small")}
                    <div style="font-size:10px; width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.name}</div>
                    <div style="font-size:10px; color:var(--orange-soft); font-weight:700;">${item.price}</div>
                `;
                card.addEventListener("click", () => {
                    if (isSpinning) return;
                    if (selectedInvIds.has(item.inv_id)) selectedInvIds.delete(item.inv_id);
                    else selectedInvIds.add(item.inv_id);
                    renderUpgraderLists();
                    recalcUpgrade();
                });
                myBox.appendChild(card);
            });
        }

        const targetBox = document.getElementById("targetItemBox");
        targetBox.innerHTML = "";
        state.all_items.forEach(item => {
            const card = document.createElement("div");
            card.className = `card clickable r-${item.rarity} ${selectedTargetItemId === item.id ? "selected" : ""}`;
            card.style.padding = "7px 5px";
            card.innerHTML = `
                ${renderMediaHTML(item, "media-small")}
                <div style="font-size:10px; width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.name}</div>
                <div style="font-size:10px; color:var(--orange-soft); font-weight:700;">${item.price}</div>
            `;
            card.addEventListener("click", () => {
                if (isSpinning) return;
                selectedTargetItemId = item.id;
                renderUpgraderLists();
                recalcUpgrade();
            });
            targetBox.appendChild(card);
        });
    }

    function recalcUpgrade() {
        let itemsSum = 0;
        state.inventory.forEach(item => {
            if (selectedInvIds.has(item.inv_id)) itemsSum += item.price;
        });
        const coinsBet = parseInt(document.getElementById("upgCoinsInput").value) || 0;
        const totalBet = itemsSum + coinsBet;
        document.getElementById("totalBetVal").innerText = totalBet;

        let targetVal = 0;
        if (targetMode === "item" && selectedTargetItemId) {
            const tItem = state.all_items.find(i => i.id === selectedTargetItemId);
            if (tItem) targetVal = tItem.price;
        } else if (targetMode === "coins") {
            targetVal = parseInt(document.getElementById("targetCoinsInput").value) || 0;
        }

        const wheel = document.getElementById("wheel");
        const chanceEl = document.getElementById("chanceVal");

        if (totalBet > 0 && targetVal > totalBet) {
            let chance = parseFloat(((totalBet / targetVal) * 92).toFixed(2));
            chance = Math.max(1, Math.min(80, chance));
            chanceEl.innerText = chance + "%";
            const deg = (chance / 100) * 360;
            wheel.style.background = `conic-gradient(#2589f5 0deg ${deg}deg, #172744 ${deg}deg 360deg)`;
        } else {
            chanceEl.innerText = "0%";
            wheel.style.background = "#172744";
        }
    }

    document.getElementById("upgSpinBtn").addEventListener("click", async () => {
        if (isSpinning) return;
        const coinsBet = parseInt(document.getElementById("upgCoinsInput").value) || 0;
        const targetCoins = parseInt(document.getElementById("targetCoinsInput").value) || 0;
        const statusEl = document.getElementById("upgStatus");

        const payload = {
            user_id: userId,
            inv_ids: Array.from(selectedInvIds),
            coins_bet: coinsBet,
            target_type: targetMode,
            target_item_id: selectedTargetItemId,
            target_coins: targetCoins
        };

        try {
            const res = await fetch("/api/upgrade", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (!res.ok) {
                statusEl.style.color = "var(--danger)";
                statusEl.innerText = data.detail || "Ошибка апгрейда";
                return;
            }

            isSpinning = true;
            document.getElementById("upgSpinBtn").disabled = true;
            statusEl.style.color = "var(--muted)";
            statusEl.innerText = "Выполняется улучшение...";

            const winDeg = (data.chance / 100) * 360;
            const targetAngle = data.win
                ? 2 + Math.random() * Math.max(1, winDeg - 4)
                : winDeg + 2 + Math.random() * (360 - winDeg - 4);

            const stopPos = (360 - targetAngle) % 360;
            const delta = (stopPos - (rotation % 360) + 360) % 360;
            rotation += 360 * 5 + delta;
            document.getElementById("wheel").style.transform = `rotate(${rotation}deg)`;

            setTimeout(async () => {
                isSpinning = false;
                document.getElementById("upgSpinBtn").disabled = false;
                document.getElementById("upgCoinsInput").value = "";
                selectedInvIds.clear();

                if (data.win) {
                    statusEl.style.color = "var(--cyan-soft)";
                    statusEl.innerText = "Успех! Награда получена";
                } else {
                    statusEl.style.color = "var(--danger)";
                    statusEl.innerText = "Неудача! Попробуйте снова";
                }
                await loadState();
            }, 3250);
        } catch (err) {
            showToast("Ошибка соединения с сервером", "error");
        }
    });

    loadState();
});
</script>
</body>
</html>
