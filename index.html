<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MECH-UPGRADE // Протокол Апгрейда</title>
<style>
  :root {
    --bg-main: #0f1622;
    --bg-panel: #182334;
    --bg-card: #1f2d42;
    --border-steel: #364d6e;
    --orange-primary: #ff6b00;
    --orange-glow: rgba(255, 107, 0, 0.35);
    --brown-rust: #6e3518;
    --brown-dark: #3b1c0d;
    --blue-tech: #00b4ff;
    --blue-dark: #103252;
    --text-main: #e2ecf7;
    --text-muted: #8aa2c0;
    --win-color: #ff7b00;
    --lose-color: #162336;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', 'Courier New', monospace, sans-serif;
  }

  body {
    background-color: var(--bg-main);
    background-image: 
      linear-gradient(rgba(0, 180, 255, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 180, 255, 0.04) 1px, transparent 1px);
    background-size: 32px 32px;
    color: var(--text-main);
    min-height: 100vh;
    padding: 20px;
  }

  .mech-frame {
    border: 2px solid var(--border-steel);
    background: var(--bg-panel);
    position: relative;
    clip-path: polygon(
      14px 0, calc(100% - 14px) 0, 100% 14px, 
      100% calc(100% - 14px), calc(100% - 14px) 100%, 
      14px 100%, 0 calc(100% - 14px), 0 14px
    );
    box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6);
  }

  header {
    max-width: 1200px;
    margin: 0 auto 20px auto;
    padding: 15px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(90deg, var(--brown-dark), var(--bg-panel) 45%, var(--blue-dark));
    border-bottom: 3px solid var(--orange-primary);
  }

  .logo {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 2px;
    color: var(--orange-primary);
    text-transform: uppercase;
    text-shadow: 0 0 10px var(--orange-glow);
  }

  .logo span {
    color: var(--blue-tech);
  }

  .status-bar {
    display: flex;
    gap: 20px;
    align-items: center;
    font-size: 14px;
    font-weight: bold;
  }

  .balance-box {
    background: var(--brown-dark);
    border: 1px solid var(--orange-primary);
    padding: 8px 16px;
    color: #ffb870;
    letter-spacing: 1px;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 380px 1fr;
    gap: 20px;
    align-items: stretch;
  }

  @media (max-width: 980px) {
    .container {
      grid-template-columns: 1fr;
    }
  }

  .slot-panel {
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 360px;
    border-top: 3px solid var(--blue-tech);
  }

  .slot-panel.target-side {
    border-top-color: var(--orange-primary);
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px dashed var(--border-steel);
    padding-bottom: 10px;
    margin-bottom: 15px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--blue-tech);
  }

  .target-side .panel-header {
    color: var(--orange-primary);
  }

  .item-preview-box {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle, rgba(54, 77, 110, 0.35) 0%, rgba(15, 22, 34, 0.8) 100%);
    border: 1px solid var(--border-steel);
    padding: 20px;
    text-align: center;
    position: relative;
  }

  .item-preview-box img {
    width: 130px;
    height: 130px;
    object-fit: contain;
    margin-bottom: 12px;
    filter: drop-shadow(0 0 12px rgba(0, 180, 255, 0.4));
    transition: transform 0.3s ease;
  }

  .target-side .item-preview-box img {
    filter: drop-shadow(0 0 14px var(--orange-glow));
  }

  .item-title {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 6px;
    color: #fff;
  }

  .item-price {
    font-size: 18px;
    font-weight: 900;
    color: var(--orange-primary);
    background: rgba(110, 53, 24, 0.4);
    padding: 4px 12px;
    border: 1px solid var(--brown-rust);
  }

  .empty-placeholder {
    color: var(--text-muted);
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .roulette-panel {
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(180deg, #1b283b 0%, #121a27 100%);
    border-top: 3px solid var(--orange-primary);
    border-bottom: 3px solid var(--blue-tech);
  }

  .wheel-wrapper {
    position: relative;
    width: 260px;
    height: 260px;
    margin: 10px auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .wheel-outer-ring {
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 4px dashed var(--brown-rust);
    box-shadow: 0 0 25px rgba(255, 107, 0, 0.2), inset 0 0 20px rgba(0, 180, 255, 0.2);
    pointer-events: none;
  }

  .wheel-pointer {
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-top: 24px solid var(--orange-primary);
    filter: drop-shadow(0 0 8px var(--orange-primary));
    z-index: 10;
  }

  .wheel-disc {
    width: 240px;
    height: 240px;
    border-radius: 50%;
    border: 6px solid var(--border-steel);
    background: conic-gradient(var(--win-color) 0deg 180deg, var(--lose-color) 180deg 360deg);
    position: relative;
    transition: transform 4s cubic-bezier(0.12, 0.85, 0.18, 1);
    box-shadow: inset 0 0 25px #000;
  }

  .wheel-core {
    position: absolute;
    width: 145px;
    height: 145px;
    background: var(--bg-main);
    border: 4px solid var(--blue-tech);
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 5;
    box-shadow: 0 0 15px rgba(0, 180, 255, 0.35);
  }

  .chance-value {
    font-size: 30px;
    font-weight: 900;
    color: var(--orange-primary);
  }

  .chance-label {
    font-size: 11px;
    text-transform: uppercase;
    color: var(--blue-tech);
    letter-spacing: 1.5px;
  }

  .result-banner {
    min-height: 28px;
    font-size: 14px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    text-align: center;
    margin: 8px 0;
  }

  .upgrade-btn {
    width: 100%;
    padding: 15px;
    font-size: 16px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #fff;
    background: linear-gradient(90deg, var(--brown-rust), var(--orange-primary));
    border: 2px solid #ff9e44;
    cursor: pointer;
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    transition: all 0.2s ease;
  }

  .upgrade-btn:hover:not(:disabled) {
    box-shadow: 0 0 20px var(--orange-glow);
    transform: translateY(-2px);
  }

  .upgrade-btn:disabled {
    background: #273447;
    border-color: #3c4f6b;
    color: #6b82a3;
    cursor: not-allowed;
  }

  .storage-section {
    max-width: 1200px;
    margin: 25px auto 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  @media (max-width: 980px) {
    .storage-section {
      grid-template-columns: 1fr;
    }
  }

  .grid-box {
    padding: 20px;
  }

  .grid-title {
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--blue-tech);
  }

  .grid-title.target-title {
    color: var(--orange-primary);
  }

  .items-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
    gap: 12px;
    max-height: 360px;
    overflow-y: auto;
    padding-right: 5px;
  }

  .item-card {
    background: var(--bg-card);
    border: 1px solid var(--border-steel);
    padding: 10px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  }

  .item-card:hover {
    border-color: var(--blue-tech);
    background: #263852;
    transform: translateY(-2px);
  }

  .item-card.selected-bet {
    border: 2px solid var(--blue-tech);
    background: rgba(0, 180, 255, 0.15);
    box-shadow: inset 0 0 12px rgba(0, 180, 255, 0.3);
  }

  .item-card.selected-target {
    border: 2px solid var(--orange-primary);
    background: rgba(255, 107, 0, 0.18);
    box-shadow: inset 0 0 12px var(--orange-glow);
  }

  .item-card img {
    width: 84px;
    height: 84px;
    object-fit: contain;
    margin-bottom: 8px;
  }

  .card-name {
    font-size: 12px;
    font-weight: bold;
    color: var(--text-main);
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-price {
    font-size: 13px;
    font-weight: 900;
    color: var(--orange-primary);
  }

  .card-tier {
    position: absolute;
    top: 4px;
    right: 6px;
    font-size: 9px;
    color: var(--blue-tech);
    text-transform: uppercase;
  }

  .reset-btn {
    background: var(--blue-dark);
    border: 1px solid var(--blue-tech);
    color: var(--blue-tech);
    padding: 4px 10px;
    font-size: 11px;
    cursor: pointer;
    text-transform: uppercase;
  }

  .reset-btn:hover {
    background: var(--blue-tech);
    color: #000;
  }
</style>
</head>
<body>

<header class="mech-frame">
  <div class="logo">MECH<span>//</span>FORGE v4.2</div>
  <div class="status-bar">
    <span>СИСТЕМА: <strong style="color:#00b4ff;">ОНЛАЙН</strong></span>
    <div class="balance-box">КРЕДИТЫ: <span id="balanceDisplay">1500</span> CR</div>
  </div>
</header>

<div class="container">
  <div class="mech-frame slot-panel">
    <div class="panel-header">
      <span>[01] МОДУЛЬ СТАВКИ</span>
      <button class="reset-btn" onclick="clearSelection()">СБРОС</button>
    </div>
    <div class="item-preview-box" id="betPreview">
      <div class="empty-placeholder">Выберите модуль из инвентаря снизу</div>
    </div>
  </div>

  <div class="mech-frame roulette-panel">
    <div class="panel-header" style="width:100%; border-color: var(--orange-primary); color: #fff;">
      <span>[02] РЕАКТОР АПГРЕЙДА</span>
      <span id="multiplierDisplay" style="color: var(--orange-primary);">x0.00</span>
    </div>

    <div class="wheel-wrapper">
      <div class="wheel-outer-ring"></div>
      <div class="wheel-pointer"></div>
      <div class="wheel-disc" id="wheelDisc"></div>
      <div class="wheel-core">
        <div class="chance-value" id="chanceDisplay">0.0%</div>
        <div class="chance-label">ШАНС УСПЕХА</div>
      </div>
    </div>

    <div class="result-banner" id="resultBanner">ОЖИДАНИЕ ЗАГРУЗКИ МОДУЛЕЙ...</div>

    <button class="upgrade-btn" id="spinBtn" disabled onclick="startUpgrade()">ЗАПУСТИТЬ АПГРЕЙД</button>
  </div>

  <div class="mech-frame slot-panel target-side">
    <div class="panel-header">
      <span>[03] ЦЕЛЕВОЙ ПРОТОТИП</span>
      <span>ВЫХОД</span>
    </div>
    <div class="item-preview-box" id="targetPreview">
      <div class="empty-placeholder">Выберите желаемый прототип</div>
    </div>
  </div>
</div>

<div class="storage-section">
  <div class="mech-frame grid-box">
    <div class="grid-title">
      <span>ВАШ ИНВЕНТАРЬ МОДУЛЕЙ</span>
      <button class="reset-btn" onclick="buyStarterPack()">+ КУПИТЬ БОКС (300 CR)</button>
    </div>
    <div class="items-grid" id="inventoryGrid"></div>
  </div>

  <div class="mech-frame grid-box">
    <div class="grid-title target-title">
      <span>БАЗА ЧЕРТЕЖЕЙ (ЦЕЛЬ)</span>
      <span style="font-size:11px; color:var(--text-muted);">ДОРОЖЕ СТАВКИ</span>
    </div>
    <div class="items-grid" id="targetGrid"></div>
  </div>
</div>

<script>
  function createMechSvg(type, primaryColor, secondaryColor) {
    const shapes = {
      core: `<circle cx="50" cy="50" r="30" fill="${secondaryColor}" stroke="${primaryColor}" stroke-width="4"/>
             <circle cx="50" cy="50" r="14" fill="${primaryColor}"/>
             <path d="M50 10 L50 22 M50 78 L50 90 M10 50 L22 50 M78 50 L90 50" stroke="${primaryColor}" stroke-width="5"/>`,
      visor: `<polygon points="15,35 85,35 75,68 25,68" fill="${secondaryColor}" stroke="${primaryColor}" stroke-width="4"/>
              <rect x="26" y="45" width="48" height="10" fill="${primaryColor}"/>
              <line x1="50" y1="35" x2="50" y2="68" stroke="#0f1622" stroke-width="3"/>`,
      claw: `<path d="M30 80 L30 45 L18 25 L35 20 L45 40 L55 40 L65 20 L82 25 L70 45 L70 80 Z" fill="${secondaryColor}" stroke="${primaryColor}" stroke-width="4"/>
             <rect x="38" y="55" width="24" height="18" fill="${primaryColor}"/>`,
      jet: `<polygon points="50,12 78,45 68,85 32,85 22,45" fill="${secondaryColor}" stroke="${primaryColor}" stroke-width="4"/>
            <polygon points="40,85 60,85 50,98" fill="${primaryColor}"/>
            <circle cx="50" cy="48" r="10" fill="${primaryColor}"/>`,
      titan: `<polygon points="25,18 75,18 88,50 70,86 30,86 12,50" fill="${secondaryColor}" stroke="${primaryColor}" stroke-width="4"/>
              <polygon points="38,36 62,36 50,66" fill="${primaryColor}"/>`
    };
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">${shapes[type] || shapes.core}</svg>`;
    return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
  }

  const ALL_ITEMS = [
    { id: 1, name: "Сервопривод MK-1", price: 150, tier: "MK-I", img: createMechSvg("claw", "#00b4ff", "#1c314a") },
    { id: 2, name: "Оптика Сканера", price: 280, tier: "MK-I", img: createMechSvg("visor", "#ff6b00", "#4a2511") },
    { id: 3, name: "Ядро Питания R2", price: 450, tier: "MK-II", img: createMechSvg("core", "#00b4ff", "#162d47") },
    { id: 4, name: "Турбина Джет-04", price: 750, tier: "MK-II", img: createMechSvg("jet", "#ff6b00", "#59280e") },
    { id: 5, name: "Клешня Разрушителя", price: 1200, tier: "MK-III", img: createMechSvg("claw", "#ff8c00", "#132942") },
    { id: 6, name: "Визор Оверлорда", price: 2100, tier: "MK-III", img: createMechSvg("visor", "#00b4ff", "#4d230d") },
    { id: 7, name: "Реактор Титана X", price: 3800, tier: "APEX", img: createMechSvg("titan", "#ff6b00", "#102842") },
    { id: 8, name: "Абсолют Меха-Ядро", price: 6500, tier: "OMEGA", img: createMechSvg("core", "#ff7b00", "#5e290c") }
  ];

  let balance = 1500;
  let inventory = [
    { uid: 101, ...ALL_ITEMS[0] },
    { uid: 102, ...ALL_ITEMS[1] },
    { uid: 103, ...ALL_ITEMS[2] }
  ];

  let selectedBet = null;
  let selectedTarget = null;
  let isSpinning = false;
  let currentRotation = 0;

  function renderAll() {
    document.getElementById("balanceDisplay").textContent = balance;

    const invGrid = document.getElementById("inventoryGrid");
    invGrid.innerHTML = "";
    inventory.forEach(item => {
      const card = document.createElement("div");
      card.className = "item-card" + (selectedBet && selectedBet.uid === item.uid ? " selected-bet" : "");
      card.innerHTML = `
        <span class="card-tier">${item.tier}</span>
        <img src="${item.img}" alt="${item.name}">
        <div class="card-name">${item.name}</div>
        <div class="card-price">${item.price} CR</div>
      `;
      card.onclick = () => selectBet(item);
      invGrid.appendChild(card);
    });

    const targetGrid = document.getElementById("targetGrid");
    targetGrid.innerHTML = "";
    ALL_ITEMS.forEach(item => {
      const card = document.createElement("div");
      card.className = "item-card" + (selectedTarget && selectedTarget.id === item.id ? " selected-target" : "");
      card.innerHTML = `
        <span class="card-tier">${item.tier}</span>
        <img src="${item.img}" alt="${item.name}">
        <div class="card-name">${item.name}</div>
        <div class="card-price">${item.price} CR</div>
      `;
      card.onclick = () => selectTarget(item);
      targetGrid.appendChild(card);
    });

    const betPreview = document.getElementById("betPreview");
    if (selectedBet) {
      betPreview.innerHTML = `
        <img src="${selectedBet.img}" alt="${selectedBet.name}">
        <div class="item-title">${selectedBet.name}</div>
        <div class="item-price">${selectedBet.price} CR</div>
      `;
    } else {
      betPreview.innerHTML = `<div class="empty-placeholder">Выберите модуль из инвентаря снизу</div>`;
    }

    const targetPreview = document.getElementById("targetPreview");
    if (selectedTarget) {
      targetPreview.innerHTML = `
        <img src="${selectedTarget.img}" alt="${selectedTarget.name}">
        <div class="item-title">${selectedTarget.name}</div>
        <div class="item-price">${selectedTarget.price} CR</div>
      `;
    } else {
      targetPreview.innerHTML = `<div class="empty-placeholder">Выберите желаемый прототип</div>`;
    }

    updateWheelChance();
  }

  function selectBet(item) {
    if (isSpinning) return;
    selectedBet = item;
    if (selectedTarget && selectedTarget.price <= selectedBet.price) {
      selectedTarget = null;
    }
    renderAll();
  }

  function selectTarget(item) {
    if (isSpinning) return;
    if (selectedBet && item.price <= selectedBet.price) {
      setBanner("ЦЕЛЬ ДОЛЖНА БЫТЬ ДОРОЖЕ СТАВКИ!", "#ff6b00");
      return;
    }
    selectedTarget = item;
    renderAll();
  }

  function clearSelection() {
    if (isSpinning) return;
    selectedBet = null;
    selectedTarget = null;
    setBanner("ОЖИДАНИЕ ЗАГРУЗКИ МОДУЛЕЙ...", "#8aa2c0");
    renderAll();
  }

  function updateWheelChance() {
    const wheelDisc = document.getElementById("wheelDisc");
    const chanceDisplay = document.getElementById("chanceDisplay");
    const multiplierDisplay = document.getElementById("multiplierDisplay");
    const spinBtn = document.getElementById("spinBtn");

    if (!selectedBet || !selectedTarget) {
      chanceDisplay.textContent = "0.0%";
      multiplierDisplay.textContent = "x0.00";
      wheelDisc.style.background = `conic-gradient(var(--lose-color) 0deg 360deg)`;
      spinBtn.disabled = true;
      return;
    }

    const rawChance = (selectedBet.price / selectedTarget.price) * 92;
    const chance = Math.max(5, Math.min(85, rawChance));
    const winAngle = (chance / 100) * 360;
    const mult = (selectedTarget.price / selectedBet.price).toFixed(2);

    chanceDisplay.textContent = chance.toFixed(1) + "%";
    multiplierDisplay.textContent = "x" + mult;
    wheelDisc.style.background = `conic-gradient(
      var(--orange-primary) 0deg ${winAngle}deg, 
      var(--blue-tech) ${winAngle}deg ${winAngle + 2}deg,
      var(--lose-color) ${winAngle + 2}deg 360deg
    )`;
    spinBtn.disabled = false;
    setBanner("СИСТЕМА ГОТОВА К СИНТЕЗУ", "#00b4ff");
  }

  function setBanner(text, color) {
    const banner = document.getElementById("resultBanner");
    banner.textContent = text;
    banner.style.color = color;
  }

  function startUpgrade() {
    if (isSpinning || !selectedBet || !selectedTarget) return;

    isSpinning = true;
    document.getElementById("spinBtn").disabled = true;
    setBanner("ИДЕТ КАЛИБРОВКА РЕАКТОРА...", "#ff6b00");

    const rawChance = (selectedBet.price / selectedTarget.price) * 92;
    const chance = Math.max(5, Math.min(85, rawChance));
    const winAngle = (chance / 100) * 360;

    const rollDeg = Math.random() * 360;
    const isWin = rollDeg <= winAngle;

    const targetStopAngle = 360 - rollDeg;
    const extraSpins = 360 * 6;
    const currentMod = currentRotation % 360;
    const delta = (targetStopAngle - currentMod + 360) % 360;
    currentRotation += extraSpins + delta;

    const wheelDisc = document.getElementById("wheelDisc");
    wheelDisc.style.transform = `rotate(${currentRotation}deg)`;

    setTimeout(() => {
      isSpinning = false;
      inventory = inventory.filter(i => i.uid !== selectedBet.uid);

      if (isWin) {
        inventory.push({ uid: Date.now(), ...selectedTarget });
        setBanner(`УСПЕХ! ПОЛУЧЕН: ${selectedTarget.name}`, "#ff6b00");
      } else {
        setBanner("СБОЙ СИНТЕЗА! МОДУЛЬ УНИЧТОЖЕН", "#00b4ff");
      }

      selectedBet = null;
      selectedTarget = null;
      renderAll();
    }, 4100);
  }

  function buyStarterPack() {
    if (isSpinning) return;
    if (balance < 300) {
      setBanner("НЕДОСТАТОЧНО КРЕДИТОВ!", "#ff6b00");
      return;
    }
    balance -= 300;
    const pool = [ALL_ITEMS[0], ALL_ITEMS[1], ALL_ITEMS[2]];
    const drop = pool[Math.floor(Math.random() * pool.length)];
    inventory.push({ uid: Date.now(), ...drop });
    setBanner(`ПОЛУЧЕН МОДУЛЬ: ${drop.name}`, "#00b4ff");
    renderAll();
  }

  renderAll();
</script>
</body>
</html>
